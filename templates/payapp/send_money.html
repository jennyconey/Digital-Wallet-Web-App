{% extends 'payapp/base.html' %}

{% block title %}
    Make payment to user
{% endblock %}

{% load crispy_forms_tags %}

{% block content %}

    <h4>Send money</h4>
    <form method="post" class="form-group">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Send</button>
    </form>
{% endblock %}
